name: Merge AdGuard Rules

on:
  workflow_dispatch:
  schedule:
    # - cron: '0 */12 * * *'
    # 每天 UTC 22:00 执行，相当于北京时间次日 06:00
    - cron: '0 22 * * *'

jobs:
  merge_rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16  # 或更新的版本

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests
          pip install pytz
          pip install dnspython3 pandas

      # - name: Remove Rules
      #   run: |
      #     rm ziyongdnsZ ziyongdnsZ1 ziyongrulerZ

      - name: Download Official Rules
        run: |
          python .github/scripts/download_rules.py --type official

      - name: Download Third-Party Rules
        run: |
          python .github/scripts/download_rules.py --type third_party

      - name: Merge baseline
        run: |
          python .github/scripts/merge_baseline.py        

      - name: Install HostlistCompiler (npm)
        run: npm install -g @adguard/hostlist-compiler

      - name: Source ziyongdnsZ Exclusion AdguardDNSRuler
        run: |
          hostlist-compiler -c dns_conf.json -o ziyongdnsZ1

      - name: Source ziyongdnsZ Exclusion AdguardDNSRuler
        run: |
          hostlist-compiler -c ziyong_conf.json -o ziyongruler    

      # - name: Merge whitelist.txt blacklist.txt
      #   run: |
      #     python .github/scripts/merge_whitelist.py     

      # - name: Optimize DNS rules
      #   run: |
      #     hostlist-compiler -i ziyongdnsZ1 -o ziyongdns
      - name: Remove useless domain
        run: |
          python .github/scripts/remove_useless_domain.py ziyongdnsZ1 ziyongdns

      # - name: Optimize General rules
      #   run: |
      #     sort -u ziyongrulerZ > ziyongruler

      - name: calssfiy ziyongruler
        run: |
          python .github/scripts/no_dns_classify.py --input ziyongruler --out-android android.txt --out-ios ios.txt --out-common common.txt

      - name: Generate README
        run: |
          python .github/scripts/generate_readme.py

      - name: Commit and Push Changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add README.md ziyongdns ziyongruler ziyongdnsZ ziyongrulerZ ziyongdnsZ1 domain_detection_records.csv AdguardDNSRuler AdguardRuler third_whitelist.txt android.txt ios.txt common.txt
          git commit -m "Updated AdGuard rules" || echo "No changes to commit"
          git push origin HEAD:main
